<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="topbar" aria-label="Application navigation">
        <a class="brand" href="{{ url_for('login') }}">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>JobTrack</span>
        </a>
        <div class="nav-actions">
            <a class="nav-link" href="{{ url_for('login') }}">Sign in</a>
            <button class="theme-toggle" type="button" aria-label="Switch color theme" data-theme-toggle>
                <span class="theme-toggle-icon" aria-hidden="true"></span>
                <span data-theme-label>Dark</span>
            </button>
        </div>
    </nav>

    <main class="auth-shell">
        <section class="auth-panel">
            <form method="POST" class="form-card auth-card">
                <div>
                    <p class="eyebrow">New account</p>
                    <h2>Register</h2>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-list">
                            {% for category, message in messages %}
                                <p class="flash flash-{{ category }}">{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <label>
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>

                <label>
                    <span>Username</span>
                    <input type="text" name="username" autocomplete="username" required>
                </label>

                <label>
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="new-password" required>
                </label>

                <label>
                    <span>Confirm Password</span>
                    <input type="password" name="confirm_password" autocomplete="new-password" required>
                </label>

                <button class="button primary-button" type="submit">Create account</button>
                <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
